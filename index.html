<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="หนี้">
<meta name="theme-color" content="#DFDED9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Debt Tracker</title>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
<style>
/* Layout: iOS grouped style — large title, white rounded groups on system gray, one column */
:root {
  /* Palette: White #FFFFFF · Mist #F4F3EF · Linen #DFDED9 · Pebble #B5B1AE · Haze #B0BFCC · Azure #9ABDE2 · Charcoal #3F3F3F */
  --bg: #DFDED9;
  --surface: #FFFFFF;
  --ink: #2B2B2B;
  --muted: #7D7974;
  --line: #DFDED9;
  --fill: #F4F3EF;
  --gold: #3F3F3F;
  --on-accent: #FFFFFF;
  --gold-soft: #DCE7F3;
  --spend: #46242A;
  --spend-soft: #F5E4E0;
  --borrow: #A8842F;
  --borrow-soft: #F3ECD8;
  --repay: #5E8A76;
  --repay-soft: #E3EEE9;
  --hero: #95B1EE;
  --hero-ink: #E7F1A8;
  --hero-muted: rgba(231,241,168,.85);
  --hero-track: rgba(255,255,255,.3);
  --hero-border: #95B1EE;
  --hero-spend: #46242A;
  --hero-borrow: #E7F1A8;
  --hero-repay: #ABC9B9;
  --hero-bar: #3A4F99;
  --hero-label: #F8F7E6;
  --col-spend: #46242A;
  --col-borrow: #7C7A2E;
  --col-repay: #5E8A76;
  --toast-link: #9ABDE2;
  --display: "Anuphan", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Thonburi, "Noto Sans Thai", Tahoma, sans-serif;
  --body: "Anuphan", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Thonburi, "Noto Sans Thai", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1A1A1A; --surface: #262626; --ink: #F4F3EF; --muted: #A09C98; --line: #363636; --fill: #303030;
  --gold: #9ABDE2; --on-accent: #1A1A1A; --gold-soft: #2A3440; --spend: #46242A; --spend-soft: #3A2622;
  --borrow: #D9C47A; --borrow-soft: #36311F; --repay: #ABC9B9; --repay-soft: #26332E;
  --hero: #95B1EE; --hero-ink: #E7F1A8; --hero-muted: rgba(231,241,168,.85); --hero-track: rgba(255,255,255,.3); --hero-border: #95B1EE;
  --hero-spend: #46242A; --hero-borrow: #E7F1A8; --hero-repay: #ABC9B9; --col-spend: #D4A9AF; --col-borrow: #E7F1A8; --col-repay: #ABC9B9; --toast-link: #3F6E9E; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1A1A1A; --surface: #262626; --ink: #F4F3EF; --muted: #A09C98; --line: #363636; --fill: #303030;
  --gold: #9ABDE2; --on-accent: #1A1A1A; --gold-soft: #2A3440; --spend: #46242A; --spend-soft: #3A2622;
  --borrow: #D9C47A; --borrow-soft: #36311F; --repay: #ABC9B9; --repay-soft: #26332E;
  --hero: #95B1EE; --hero-ink: #E7F1A8; --hero-muted: rgba(231,241,168,.85); --hero-track: rgba(255,255,255,.3); --hero-border: #95B1EE;
  --hero-spend: #46242A; --hero-borrow: #E7F1A8; --hero-repay: #ABC9B9; --col-spend: #D4A9AF; --col-borrow: #E7F1A8; --col-repay: #ABC9B9; --toast-link: #3F6E9E; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
.num { font-variant-numeric: tabular-nums }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }

/* Balance */
.apptitle { margin: 8px 0 -4px; font-family: var(--display); font-weight: 700; font-size: 34px; letter-spacing: -.01em }
.hero { background: var(--hero); color: var(--hero-ink); border: 1px solid var(--hero-border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px }
.hero .lab { font-size: 13px; font-weight: 700; color: var(--hero-label) }
.hero .big { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 11vw, 48px); line-height: 1.05; letter-spacing: -.02em }
.hero .big small { font-size: .38em; font-weight: 500; color: var(--hero-muted); margin-left: 6px; letter-spacing: 0 }
.meter { height: 6px; border-radius: 3px; background: var(--hero-track); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--hero-bar); border-radius: 3px }
.hero .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--hero-track); padding-top: 14px }
.hero .row div { display: flex; flex-direction: column }
.hero .row b { font-weight: 600; font-size: 17px }
.hero .row span { font-size: 12px; font-weight: 700; color: var(--hero-label) }
.hero .row .s b { color: var(--hero-spend) } .hero .row .b b { color: var(--hero-borrow) } .hero .row .r b { color: var(--hero-repay) }

/* Card */
.card { background: var(--surface); border: 0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px }
#view.card { padding-inline: 14px }
.card h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 18px; display: flex; justify-content: space-between; align-items: center; gap: 8px }
.card h2 .x { font: 500 13px var(--body); color: var(--muted); background: none; border: 0; padding: 4px }

/* Form */
.amount { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--line); padding-bottom: 4px }
.amount:focus-within { border-color: var(--gold) }
.amount input { border: 0; background: none; outline: none; font-family: var(--display); font-weight: 700; font-size: 34px; width: 100%; min-width: 0; padding: 0 }
.amount span { color: var(--muted); font-size: 15px }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--fill); border-radius: 9px; padding: 2px }
.seg button { border: 0; background: none; border-radius: 7px; padding: 7px 4px; font-weight: 500; font-size: 14px }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips button { border: 0; background: var(--fill); border-radius: 999px; padding: 6px 12px; font-size: 14px }
.chips button[aria-pressed="true"] { background: var(--gold); color: var(--on-accent) }
.fields { display: grid; grid-template-columns: 1fr 9.5em; gap: 8px }
.fields .full { grid-column: 1 / -1 }
.field { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.field label { font-size: 12px; color: var(--muted) }
.field input { border: 0; background: var(--fill); border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0 }
.actions { display: flex; gap: 8px }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; background: var(--gold); color: var(--on-accent); flex: 1 }
.btn:disabled { opacity: .5; cursor: default }
.btn.ghost { background: var(--fill); color: var(--gold); flex: 0 0 auto }
.btn.danger { background: var(--spend-soft); color: var(--spend); flex: 0 0 auto }
.recent { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none }
.recent button { flex: 0 0 auto; border: 0; background: var(--fill); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--muted) }

/* Tabs + month nav */
.tabs { display: flex; gap: 2px; background: var(--fill); border-radius: 9px; padding: 2px }
.tabs button { flex: 1; border: 0; background: none; border-radius: 7px; padding: 7px 4px; font-weight: 500; font-size: 14px }
.tabs button[aria-selected="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12) }
.mnav { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.mnav b { font-family: var(--display); font-weight: 600; font-size: 17px }
.mnav button { border: 0; background: none; color: var(--gold); width: 38px; height: 38px; font-size: 26px; line-height: 1 }
.mnav button:disabled { opacity: .35 }

/* Ledger list */
.day { display: flex; flex-direction: column }
.day h3 { margin: 6px 0 2px; font-size: 13px; font-weight: 500; color: var(--muted); display: flex; justify-content: space-between }
.swipe { position: relative; overflow: hidden; border-bottom: 1px solid var(--line) }
.swipe .acts { position: absolute; top: 0; right: 0; bottom: 0; display: flex }
.swipe .acts button { border: 0; width: 76px; color: #fff; font-weight: 500; font-size: 14px }
.swipe .acts .ed { background: var(--muted) }
.swipe .acts .rm { background: var(--spend) }
.item { position: relative; z-index: 1; display: grid; grid-template-columns: 4px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border: 0; background: var(--surface); text-align: left; width: 100%; touch-action: pan-y; transition: transform .22s ease }
.item.dragging { transition: none }
@media (prefers-reduced-motion: reduce) { .item { transition: none } }
.hint { font-size: 12px; color: var(--muted); text-align: center; margin: 2px 0 0 }
.item .bar { width: 4px; align-self: stretch; border-radius: 2px }
.item .t { min-width: 0 }
.item .t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.item .t small { color: var(--muted); font-size: 12px }
.item .a { font-weight: 600 }
.k-ใช้จ่าย .bar { background: var(--spend) } .k-ยืม .bar { background: var(--borrow) } .k-จ่ายคืน .bar { background: var(--repay) }
.k-จ่ายคืน .a { color: var(--repay) }
.empty { color: var(--muted); text-align: center; padding: 24px 8px }

/* Category table */
table { width: 100%; border-collapse: collapse }
th, td { padding: 8px 4px; text-align: left; border-bottom: 1px solid var(--line) }
th { font-size: 12px; color: var(--muted); font-weight: 500 }
td.r, th.r { text-align: right }
tr.tot td { font-weight: 600; border-bottom: 0 }
.tag { display: inline-block; background: var(--hero); border-radius: 6px; padding: 1px 7px; font-weight: 700 }
th .tag.s { color: var(--hero-spend) } th .tag.b { color: var(--hero-borrow) } th .tag.r { color: var(--hero-repay) }
td.cs { color: var(--col-spend) } td.cb { color: var(--col-borrow) } td.cr { color: var(--col-repay) }
tr.zero td { color: var(--muted) }
.pbar { height: 4px; border-radius: 2px; background: var(--gold-soft); margin-top: 4px; overflow: hidden }
.pbar i { display: block; height: 100% }
.scroll { overflow-x: auto }
.scroll table { min-width: 480px }
.scroll table.sumtbl { min-width: 0; font-size: 13px }
.sumtbl th, .sumtbl td { padding: 11px 3px; white-space: nowrap }
.sumtbl tr.yr td { padding: 16px 0 6px; font-size: 12px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--line) }
.sumtbl tbody tr:first-child.yr td { padding-top: 6px }
.sumtbl th:nth-child(4), .sumtbl td:nth-child(4) { padding-right: 8px }
.sumtbl th:nth-child(5), .sumtbl td:nth-child(5) { border-left: 1px solid var(--line); padding-left: 8px; text-align: left }
.sumtbl td:nth-child(5) { font-size: 9.5px }
.sumtbl th:nth-child(5), .sumtbl th:nth-child(6) { text-align: center }
.sumtbl th:first-child, .sumtbl td:first-child { padding-left: 0 }
.sumtbl th:last-child, .sumtbl td:last-child { padding-right: 0 }
.sumtbl th { font-size: 11px }
.sumtbl .tag { padding: 1px 4px; border-radius: 5px }
.sumtbl td.up { color: var(--col-spend) } .sumtbl td.dn { color: var(--col-repay) }
.sumtbl .arr { font-size: 7px; margin-right: 2px; vertical-align: 1px }
@media (max-width: 380px) { .scroll table.sumtbl { font-size: 12px } .sumtbl th, .sumtbl td { padding-inline: 2px } }
.chart svg { display: block; max-width: none }
.chartbox { display: flex; align-items: flex-start }
.cscroll { flex: 1; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; touch-action: pan-x }
.chartbar { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.zoom { display: flex; gap: 2px; background: var(--fill); border-radius: 8px; padding: 2px }
.zoom button { border: 0; background: none; border-radius: 6px; min-width: 32px; height: 28px; padding: 0 8px; font-size: 13px; font-weight: 600; color: var(--gold) }
.zoom button:active { background: var(--surface) }
.note { font-size: 12px; color: var(--muted) }

.bkbanner { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--borrow-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px }
.bkbanner button { border: 0; background: var(--gold); color: var(--on-accent); border-radius: 8px; padding: 6px 12px; font-weight: 600; flex: 0 0 auto }
.bkconfirm { display: flex; flex-direction: column; gap: 8px; background: var(--fill); border-radius: 10px; padding: 12px; font-size: 14px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 14px }
.toast button { border: 0; background: none; color: var(--toast-link); font-weight: 600; padding: 0 }
.status { font-size: 13px; color: var(--muted); text-align: center }
@media (prefers-reduced-motion: no-preference) { .meter i { transition: width .4s ease } }
</style>

<div class="wrap">
  <h1 class="apptitle">หนี้</h1>
  <div class="bkbanner" id="bkBanner" hidden><span id="bkBannerText"></span><button type="button" id="bkBannerBtn">สำรองเลย</button></div>
  <section class="hero" aria-label="ยอดหนี้">
    <div>
      <div class="lab">ยอดหนี้คงเหลือ</div>
      <div class="big num" id="bal">–<small>บาท</small></div>
    </div>
    <div>
      <div class="meter"><i id="meter" style="width:0"></i></div>
      <div class="lab" id="paidPct" style="margin-top:6px">กำลังโหลด…</div>
    </div>
    <div class="row">
      <div class="s"><b class="num" id="mS">–</b><span>ใช้จ่ายเดือนนี้</span></div>
      <div class="b"><b class="num" id="mB">–</b><span>ยืมเดือนนี้</span></div>
      <div class="r"><b class="num" id="mR">–</b><span>จ่ายคืนเดือนนี้</span></div>
    </div>
  </section>

  <form class="card" id="form" autocomplete="off">
    <h2><span id="formTitle">จดรายการ</span><button type="button" class="x" id="cancelEdit" hidden>ยกเลิกแก้ไข</button></h2>
    <div class="amount"><input id="amt" inputmode="decimal" placeholder="0" aria-label="จำนวนเงิน"><span>บาท</span></div>
    <div class="seg" role="group" aria-label="ประเภท">
      <button type="button" data-t="ใช้จ่าย" aria-pressed="true">ใช้จ่าย</button>
      <button type="button" data-t="ยืม" aria-pressed="false">ยืม</button>
      <button type="button" data-t="จ่ายคืน" aria-pressed="false">จ่ายคืน</button>
    </div>
    <div class="chips" id="cats" role="group" aria-label="หมวด"></div>
    <div class="fields">
      <div class="field"><label for="name">รายการ</label><input id="name" list="names" placeholder="เช่น ข้าวเที่ยง"></div>
      <div class="field"><label for="date">วันที่</label><input id="date" type="date"></div>
      <div class="field full"><label for="note">หมายเหตุ (ไม่ใส่ก็ได้)</label><input id="note"></div>
    </div>
    <datalist id="names"></datalist>
    <div class="recent" id="recent" aria-label="รายการที่ใช้บ่อย"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="del" hidden>ลบ</button>
      <button type="submit" class="btn" id="save" disabled>บันทึก</button>
    </div>
  </form>

  <div class="tabs" role="tablist">
    <button role="tab" data-v="list" aria-selected="true">รายการ</button>
    <button role="tab" data-v="cat" aria-selected="false">หมวดเดือนนี้</button>
    <button role="tab" data-v="sum" aria-selected="false">สรุปรายเดือน</button>
  </div>

  <section class="card" id="view">
    <div class="mnav" id="mnav">
      <button type="button" id="prev" aria-label="เดือนก่อน">‹</button>
      <b id="mlabel">–</b>
      <button type="button" id="next" aria-label="เดือนถัดไป">›</button>
    </div>
    <div id="content"><div class="empty">กำลังโหลดข้อมูล…</div></div>
  </section>

  <section class="card" aria-label="สำรองข้อมูล">
    <h2>สำรองข้อมูล</h2>
    <p class="note" style="margin:0">ข้อมูลเก็บอยู่ในเครื่องนี้เครื่องเดียว สำรองเป็นไฟล์ไว้ใน iCloud Drive หรือ Google Drive เผื่อลบแอพ ล้าง Safari หรือเปลี่ยนเครื่อง</p>
    <div class="note" id="bkInfo"></div>
    <div class="actions"><button type="button" class="btn" id="bkSave">สำรองข้อมูล</button><button type="button" class="btn ghost" id="bkPick">กู้คืนจากไฟล์</button></div>
    <input type="file" id="bkFile" accept=".json,.csv,application/json,text/csv" hidden>
    <div class="bkconfirm" id="bkConfirm" hidden><span id="bkConfirmText"></span>
      <div class="actions"><button type="button" class="btn danger" id="bkApply">แทนที่ด้วยข้อมูลจากไฟล์</button><button type="button" class="btn ghost" id="bkCancel">ยกเลิก</button></div></div>
  </section>
  <div class="status" id="status"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS = ["อาหาร/เครื่องดื่ม","แมว","ของใช้/ซื้อของ","เดินทาง/เที่ยว","สุขภาพ","เกม/บันเทิง","Fix cost","อื่นๆ"];
const CAT_COLORS = ["#C98B6B","#9A8FB8","#9ABDE2","#8DAA97","#C48A9A","#CDB06A","#B5B1AE","#7D8FA3"];
const TH_M = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const TH_MS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const $ = id => document.getElementById(id);
const fmt = (n, d = 0) => (n || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt2 = n => fmt(n, Number.isInteger(n) ? 0 : 2);
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const t = new Date(); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; };
const mLabel = k => { const [y, m] = k.split("-"); return `${TH_M[+m-1]} ${y}`; };
const mShort = k => { const [y, m] = k.split("-"); return `${TH_MS[+m-1]} ${y.slice(2)}`; };
const addMonth = (k, d) => { let [y, m] = k.split("-").map(Number); m += d; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let months = {}, loaded = false, canWrite = true;
const STORE = "dt.data", BK = "dt.lastBackup";
let view = "list", curMonth = todayStr().slice(0, 7);
let form = { t: "ใช้จ่าย", c: "อาหาร/เครื่องดื่ม", editing: null };

try { const v = localStorage.getItem("dt.view"); if (["list","cat","sum"].includes(v)) view = v; } catch (e) {}

function all() { return Object.values(months).flat(); }
function sumBy(list, t) { return list.reduce((s, e) => s + (e.t === t ? +e.a || 0 : 0), 0); }

function toast(msg, action) {
  const el = $("toast"); el.textContent = "";
  const s = document.createElement("span"); s.textContent = msg; el.append(s);
  if (action) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = action.label;
    b.onclick = () => { el.hidden = true; action.fn(); }; el.append(b);
  }
  el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, action ? 5000 : 2200);
}

/* ---------- Hero ---------- */
function renderHero() {
  const a = all();
  const s = sumBy(a, "ใช้จ่าย"), b = sumBy(a, "ยืม"), r = sumBy(a, "จ่ายคืน");
  $("bal").innerHTML = `${fmt2(Math.round((s + b - r) * 100) / 100)}<small>บาท</small>`;
  const pct = s + b ? r / (s + b) : 0;
  $("meter").style.width = (pct * 100).toFixed(1) + "%";
  $("paidPct").textContent = loaded ? `จ่ายคืนแล้ว ${fmt(r)} จาก ${fmt(s + b)} (${(pct * 100).toFixed(1)}%)` : "กำลังโหลด…";
  const m = months[todayStr().slice(0, 7)] || [];
  $("mS").textContent = fmt(sumBy(m, "ใช้จ่าย"));
  $("mB").textContent = fmt(sumBy(m, "ยืม"));
  $("mR").textContent = fmt(sumBy(m, "จ่ายคืน"));
}

/* ---------- Form ---------- */
function renderForm() {
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === form.t));
  const cats = $("cats");
  cats.hidden = form.t !== "ใช้จ่าย";
  cats.innerHTML = CATS.map(c => `<button type="button" data-c="${esc(c)}" aria-pressed="${c === form.c}">${esc(c)}</button>`).join("");
  validate();
}
function validate() {
  const a = parseFloat($("amt").value.replace(/,/g, ""));
  $("save").disabled = !(a > 0) || !$("date").value || !loaded || !canWrite;
}
function resetForm() {
  form.editing = null;
  $("amt").value = ""; $("name").value = ""; $("note").value = ""; $("date").value = todayStr();
  $("formTitle").textContent = "จดรายการ"; $("cancelEdit").hidden = true; $("del").hidden = true; $("save").textContent = "บันทึก";
  $("del").dataset.confirm = "";
  renderForm();
}
function editEntry(e) {
  form.editing = e; form.t = e.t; if (e.c) form.c = e.c;
  $("amt").value = e.a; $("name").value = e.n || ""; $("note").value = e.note || ""; $("date").value = e.d;
  $("formTitle").textContent = "แก้ไขรายการ"; $("cancelEdit").hidden = false; $("del").hidden = false; $("save").textContent = "บันทึกการแก้ไข";
  $("del").textContent = "ลบ"; $("del").dataset.confirm = "";
  renderForm();
  $("form").scrollIntoView({ behavior: "smooth", block: "start" });
}
function renderRecent() {
  const counts = {};
  all().filter(e => e.t === "ใช้จ่าย" && e.n).slice(-300).forEach(e => {
    const k = e.n + "|" + e.c; counts[k] = counts[k] || { n: e.n, c: e.c, a: e.a, k: 0 }; counts[k].k++; counts[k].a = e.a;
  });
  const top = Object.values(counts).sort((x, y) => y.k - x.k).slice(0, 8);
  $("recent").innerHTML = top.map((r, i) => `<button type="button" data-i="${i}">${esc(r.n)} · ${fmt2(+r.a)}</button>`).join("");
  $("recent").onclick = ev => {
    const b = ev.target.closest("button"); if (!b) return;
    const r = top[+b.dataset.i];
    form.t = "ใช้จ่าย"; form.c = r.c || "อื่นๆ"; $("name").value = r.n; $("amt").value = r.a; renderForm();
  };
  const names = [...new Set(all().map(e => e.n).filter(Boolean))].slice(-200);
  $("names").innerHTML = names.map(n => `<option value="${esc(n)}">`).join("");
}

/* ---------- Writes (one at a time) ---------- */
function persist() {
  localStorage.setItem(STORE, JSON.stringify({ app: "debt-tracker", version: 1, items: all() }));
}
async function writeMonth(k, items) {
  if (items.length) months[k] = items; else delete months[k];
  try { persist(); } catch (e) { throw { code: "quota_exceeded" }; }
}
function setItems(list) {
  months = {};
  list.forEach(e => (months[e.d.slice(0, 7)] = months[e.d.slice(0, 7)] || []).push(e));
  Object.values(months).forEach(m => m.sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0));
}
async function saveEntry(entry, old) {
  const k = entry.d.slice(0, 7);
  const sortFn = (x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0;
  if (old && old.d.slice(0, 7) !== k) {
    const ok = old.d.slice(0, 7);
    const rest = (months[ok] || []).filter(x => x.id !== old.id);
    months[ok] = rest; await writeMonth(ok, rest);
  }
  const items = (months[k] || []).filter(x => x.id !== entry.id).concat(entry).sort(sortFn);
  months[k] = items;
  await writeMonth(k, items);
}
async function deleteEntry(e) {
  const k = e.d.slice(0, 7);
  const items = (months[k] || []).filter(x => x.id !== e.id);
  months[k] = items;
  await writeMonth(k, items);
}
function failMsg(err) {
  if (err && err.code === "invalid_argument") { canWrite = false; validate(); return "บัญชีนี้ไม่มีสิทธิ์บันทึก ดูข้อมูลได้อย่างเดียว"; }
  if (err && err.code === "quota_exceeded") return "พื้นที่เก็บข้อมูลเต็ม ลบรายการเก่าบางส่วนก่อน";
  return "บันทึกไม่สำเร็จ ลองอีกครั้ง";
}

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const a = Math.round(parseFloat($("amt").value.replace(/,/g, "")) * 100) / 100;
  if (!(a > 0) || !loaded) return;
  const old = form.editing;
  const entry = {
    id: old ? old.id : "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    d: $("date").value, n: $("name").value.trim() || (form.t === "ใช้จ่าย" ? form.c : form.t),
    t: form.t, c: form.t === "ใช้จ่าย" ? form.c : "", a
  };
  const note = $("note").value.trim(); if (note) entry.note = note;
  $("save").disabled = true;
  try {
    await saveEntry(entry, old);
    toast(old ? "แก้ไขแล้ว" : `บันทึกแล้ว: ${entry.t} ${fmt2(a)} บาท`);
    curMonth = entry.d.slice(0, 7);
    resetForm(); renderAll();
  } catch (err) { toast(failMsg(err)); validate(); }
});
$("del").addEventListener("click", async () => {
  const b = $("del");
  if (!b.dataset.confirm) { b.dataset.confirm = "1"; b.textContent = "แตะอีกครั้งเพื่อลบ"; return; }
  const e = form.editing; if (!e) return;
  try { await deleteEntry(e); toast("ลบรายการแล้ว"); resetForm(); renderAll(); }
  catch (err) { toast(failMsg(err)); }
});
$("cancelEdit").addEventListener("click", resetForm);
document.querySelector(".seg").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return; form.t = b.dataset.t; renderForm();
});
$("cats").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return; form.c = b.dataset.c; renderForm();
});
["amt", "date"].forEach(id => $(id).addEventListener("input", validate));

/* ---------- Views ---------- */
document.querySelector(".tabs").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  view = b.dataset.v; try { localStorage.setItem("dt.view", view); } catch (e) {}
  renderView();
});
$("prev").onclick = () => { curMonth = addMonth(curMonth, -1); renderView(); };
$("next").onclick = () => { curMonth = addMonth(curMonth, 1); renderView(); };

function monthRange() {
  const ks = Object.keys(months).filter(k => months[k].length).sort();
  const first = ks[0] || curMonth, last = [ks[ks.length - 1] || curMonth, todayStr().slice(0, 7)].sort().pop();
  return [first, last];
}

function renderList(items) {
  if (!items.length) return `<div class="empty">ยังไม่มีรายการใน${mLabel(curMonth)}<br>จดรายการแรกได้จากฟอร์มด้านบน</div>`;
  const days = {};
  items.forEach(e => (days[e.d] = days[e.d] || []).push(e));
  return Object.keys(days).sort().reverse().map(d => {
    const list = days[d];
    const net = list.reduce((s, e) => s + (e.t === "จ่ายคืน" ? -e.a : +e.a), 0);
    const [y, m, dd] = d.split("-");
    return `<div class="day"><h3><span>${+dd} ${TH_MS[+m-1]} ${y}</span><span class="num">${net < 0 ? "−" : ""}${fmt2(Math.abs(net))}</span></h3>` +
      list.map(e => `<div class="swipe" data-id="${esc(e.id)}"><div class="acts"><button type="button" class="ed" data-act="edit" tabindex="-1">แก้ไข</button><button type="button" class="rm" data-act="del" tabindex="-1">ลบ</button></div>
        <button type="button" class="item k-${esc(e.t)}"><span class="bar"></span>
        <span class="t"><div>${esc(e.n)}</div><small>${esc(e.t === "ใช้จ่าย" ? (e.c || "ไม่ระบุหมวด") : e.t)}${e.note ? " · " + esc(e.note) : ""}</small></span>
        <span class="a num">${e.t === "จ่ายคืน" ? "−" : ""}${fmt2(+e.a)}</span></button></div>`).join("") + `</div>`;
  }).join("") + `<p class="hint">ปัดรายการไปทางซ้ายเพื่อแก้ไขหรือลบ</p>`;
}

function renderCat(items) {
  const rows = CATS.map((c, i) => ({ c, color: CAT_COLORS[i], v: items.reduce((s, e) => s + (e.t === "ใช้จ่าย" && e.c === c ? +e.a : 0), 0) }));
  rows.push({ c: "ยืม", color: "var(--borrow)", v: sumBy(items, "ยืม") });
  rows.push({ c: "(ไม่ระบุหมวด)", color: "var(--muted)", v: items.reduce((s, e) => s + (e.t === "ใช้จ่าย" && !e.c ? +e.a : 0), 0) });
  const tot = rows.reduce((s, r) => s + r.v, 0);
  return `<p class="note" style="margin:0">ประเภท "ใช้จ่าย" แยกตามหมวด รวมกับ "ยืม"</p><table><thead><tr><th>หมวด</th><th class="r">ยอด</th><th class="r">สัดส่วน</th></tr></thead><tbody>` +
    rows.map(r => {
      const p = tot ? r.v / tot : 0;
      return `<tr class="${r.v ? "" : "zero"}"><td>${esc(r.c)}<div class="pbar"><i style="width:${(p * 100).toFixed(1)}%;background:${r.color}"></i></div></td>
        <td class="r num">${r.v ? fmt(r.v, 2) : "–"}</td><td class="r num">${Math.round(p * 100)}%</td></tr>`;
    }).join("") +
    `<tr class="tot"><td>รวม</td><td class="r num">${fmt(tot, 2)}</td><td></td></tr></tbody></table>`;
}

/* ---------- Cumulative chart: scroll + pinch zoom ---------- */
const CH = { H: 190, T: 16, B: 26, PL: 22, PR: 30, AX: 40 };
let chartRows = [], chartPX = 52;
try { const v = +localStorage.getItem("dt.chartPX"); if (v > 0) chartPX = v; } catch (e) {}
function chartScale(rows) {
  const max = Math.max(1, ...rows.map(r => r.cum));
  const mag = Math.pow(10, Math.floor(Math.log10(max)));
  const step = mag * (max / mag > 5 ? 2 : 1);
  const top = Math.ceil(max / step) * step;
  return { step, top, y: v => CH.T + (1 - v / top) * (CH.H - CH.T - CH.B) };
}
function chartAxis(rows) {
  const { step, top, y } = chartScale(rows);
  let out = "";
  for (let v = 0; v <= top; v += step) out += `<text x="${CH.AX - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v >= 1000 ? fmt(v / 1000) + "k" : v}</text>`;
  return out;
}
function chartPlot(rows) {
  const PX = chartPX, n = rows.length - 1;
  const W = CH.PL + CH.PR + Math.max(1, n) * PX;
  const { step, top, y } = chartScale(rows);
  const x = i => CH.PL + i * PX;
  let grid = "";
  for (let v = 0; v <= top; v += step) grid += `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`;
  const pts = rows.map((r, i) => `${x(i).toFixed(1)},${y(r.cum).toFixed(1)}`).join(" ");
  const every = Math.max(1, Math.ceil(46 / PX));
  const lab = rows.map((r, i) => (n - i) % every === 0 ? `<text x="${x(i)}" y="${CH.H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${mShort(r.k)}</text>` : "").join("");
  const dots = PX >= 26 ? rows.map((r, i) => i < n ? `<circle cx="${x(i)}" cy="${y(r.cum)}" r="2" fill="var(--gold)"/>` : "").join("") : "";
  const lastP = rows.length ? `<circle cx="${x(n)}" cy="${y(rows[n].cum)}" r="4" fill="var(--gold)"/><text x="${x(n)}" y="${y(rows[n].cum) - 9}" text-anchor="end" font-size="10" font-weight="700" fill="var(--ink)">${fmt(rows[n].cum)}</text>` : "";
  return `<svg width="${W}" height="${CH.H}" role="img" aria-label="กราฟยอดหนี้สะสมรายเดือน">${grid}
    <polygon points="${x(0)},${y(0)} ${pts} ${x(n)},${y(0)}" fill="var(--gold-soft)" opacity=".8"/>
    <polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2"/>${dots}${lastP}${lab}</svg>`;
}
function fitPX(c) { return Math.max(4, (c.clientWidth - CH.PL - CH.PR) / Math.max(1, chartRows.length - 1)); }
function zoomTo(px, focusX, focusIdx) {
  const c = $("cscroll"); if (!c) return;
  const left = c.getBoundingClientRect().left;
  const fx = focusX ?? left + c.clientWidth / 2;
  const idx = focusIdx ?? (c.scrollLeft + fx - left - CH.PL) / chartPX;
  chartPX = Math.min(140, Math.max(Math.min(fitPX(c), 52), px));
  c.innerHTML = chartPlot(chartRows);
  c.scrollLeft = CH.PL + idx * chartPX - (fx - left);
}
function saveZoom() { try { localStorage.setItem("dt.chartPX", String(Math.round(chartPX * 100) / 100)); } catch (e) {} }
function setupChart() {
  const c = $("cscroll"); if (!c) return;
  chartPX = Math.min(140, Math.max(Math.min(fitPX(c), 52), chartPX));
  c.innerHTML = chartPlot(chartRows);
  c.scrollLeft = c.scrollWidth;
  document.querySelector(".zoom").onclick = ev => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.z === "fit") { chartPX = fitPX(c); c.innerHTML = chartPlot(chartRows); c.scrollLeft = 0; }
    else zoomTo(chartPX * (b.dataset.z === "in" ? 1.5 : 1 / 1.5));
    saveZoom();
  };
  let pinch = null;
  const mid = t => (t[0].clientX + t[1].clientX) / 2;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  c.addEventListener("touchstart", ev => {
    if (ev.touches.length !== 2) return;
    const left = c.getBoundingClientRect().left, fx = mid(ev.touches);
    pinch = { d0: dist(ev.touches) || 1, px0: chartPX, idx: (c.scrollLeft + fx - left - CH.PL) / chartPX };
  }, { passive: true });
  c.addEventListener("touchmove", ev => {
    if (!pinch || ev.touches.length !== 2) return;
    ev.preventDefault();
    zoomTo(pinch.px0 * dist(ev.touches) / pinch.d0, mid(ev.touches), pinch.idx);
  }, { passive: false });
  c.addEventListener("touchend", ev => { if (pinch && ev.touches.length < 2) { pinch = null; saveZoom(); } });
  c.addEventListener("gesturestart", ev => ev.preventDefault());
  c.addEventListener("wheel", ev => {
    if (!ev.ctrlKey) return;
    ev.preventDefault(); zoomTo(chartPX * Math.exp(-ev.deltaY * 0.01), ev.clientX); saveZoom();
  }, { passive: false });
}

function renderSum() {
  const [first, last] = monthRange();
  const ks = []; for (let k = first; k <= last; k = addMonth(k, 1)) ks.push(k);
  let cum = 0;
  const rows = ks.map(k => {
    const m = months[k] || [];
    const s = sumBy(m, "ใช้จ่าย"), b = sumBy(m, "ยืม"), r = sumBy(m, "จ่ายคืน");
    cum += s + b - r;
    return { k, s, b, r, net: s + b - r, cum };
  });
  chartRows = rows;
  const svg = `<div class="chartbar"><span class="note">ยอดหนี้สะสม (บาท)</span><div class="zoom" role="group" aria-label="ซูมกราฟ">
      <button type="button" data-z="out" aria-label="ซูมออก">−</button><button type="button" data-z="fit">ทั้งหมด</button><button type="button" data-z="in" aria-label="ซูมเข้า">+</button></div></div>
    <div class="chartbox"><svg class="yaxis" width="${CH.AX}" height="${CH.H}" aria-hidden="true">${chartAxis(rows)}</svg>
    <div class="cscroll" id="cscroll">${chartPlot(rows)}</div></div>
    <div class="note">ใช้สองนิ้วถ่างหรือหุบบนกราฟเพื่อซูม · ปัดซ้ายขวาเพื่อเลื่อน</div>`;
  const tot = rows.reduce((a, r) => ({ s: a.s + r.s, b: a.b + r.b, r: a.r + r.r }), { s: 0, b: 0, r: 0 });
  const cell = v => v ? fmt(v) : "–";
  return `<div class="chart">${svg}</div>
    <div class="scroll"><table class="sumtbl"><thead><tr><th></th><th class="r"><span class="tag s">ใช้จ่าย</span></th><th class="r"><span class="tag b">ยืม</span></th><th class="r"><span class="tag r">จ่ายคืน</span></th><th class="r">สุทธิ</th><th class="r">สะสม</th></tr></thead><tbody>` +
    rows.slice().reverse().map((r, i, arr) => (i === 0 || arr[i - 1].k.slice(0, 4) !== r.k.slice(0, 4) ? `<tr class="yr"><td colspan="6">${r.k.slice(0, 4)}</td></tr>` : "") + `<tr><td>${TH_MS[+r.k.slice(5) - 1]}</td><td class="r num cs">${cell(r.s)}</td><td class="r num cb">${cell(r.b)}</td><td class="r num cr">${cell(r.r)}</td>
      <td class="r num ${r.net > 0 ? "up" : r.net < 0 ? "dn" : ""}">${r.net > 0 ? `<span class="arr">▲</span>${fmt(r.net)}` : r.net < 0 ? `<span class="arr">▼</span>${fmt(-r.net)}` : "–"}</td><td class="r num">${fmt(r.cum)}</td></tr>`).join("") +
    `<tr class="tot"><td>รวม</td><td class="r num cs">${fmt(tot.s)}</td><td class="r num cb">${fmt(tot.b)}</td><td class="r num cr">${fmt(tot.r)}</td><td class="r num">${fmt(tot.s + tot.b - tot.r)}</td><td></td></tr></tbody></table></div>
    <div class="actions"><button type="button" class="btn ghost" id="export" hidden style="flex:1">ส่งออกทุกรายการเป็นไฟล์ CSV (เปิดใน Excel ได้)</button></div>`;
}

function renderView() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === view));
  $("mnav").hidden = view === "sum";
  const [first, last] = monthRange();
  $("prev").disabled = curMonth <= first; $("next").disabled = curMonth >= last;
  $("mlabel").textContent = mLabel(curMonth);
  if (!loaded) return;
  const items = months[curMonth] || [];
  $("content").innerHTML = view === "list" ? renderList(items) : view === "cat" ? renderCat(items) : renderSum();
  if (view === "sum") { setupExport(); setupChart(); }
}
/* ---------- Swipe left to reveal แก้ไข / ลบ ---------- */
const OPEN_X = -152;
let openRow = null, drag = null, suppressClick = false;
function setX(row, x) { row.querySelector(".item").style.transform = x ? `translateX(${x}px)` : ""; }
function closeOpen() { if (openRow) { setX(openRow, 0); openRow = null; } }
const findEntry = row => (months[curMonth] || []).find(x => x.id === row.dataset.id);

$("content").addEventListener("pointerdown", ev => {
  const item = ev.target.closest(".item"); if (!item) return;
  const row = item.parentElement;
  if (openRow && openRow !== row) closeOpen();
  drag = { row, item, id: ev.pointerId, x0: ev.clientX, y0: ev.clientY, base: openRow === row ? OPEN_X : 0, dir: null, x: 0 };
});
$("content").addEventListener("pointermove", ev => {
  if (!drag || ev.pointerId !== drag.id) return;
  const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if (!drag.dir) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { drag.dir = "h"; drag.item.classList.add("dragging"); try { drag.item.setPointerCapture(ev.pointerId); } catch (e) {} }
    else if (Math.abs(dy) > 8) { drag = null; return; }
    else return;
  }
  drag.x = Math.max(OPEN_X - 30, Math.min(0, drag.base + dx));
  setX(drag.row, drag.x);
});
function endDrag(ev) {
  if (!drag || ev.pointerId !== drag.id) return;
  if (drag.dir === "h") {
    drag.item.classList.remove("dragging");
    const open = drag.x < OPEN_X / 2.5;
    setX(drag.row, open ? OPEN_X : 0);
    openRow = open ? drag.row : (openRow === drag.row ? null : openRow);
    suppressClick = true; setTimeout(() => suppressClick = false, 50);
  }
  drag = null;
}
$("content").addEventListener("pointerup", endDrag);
$("content").addEventListener("pointercancel", endDrag);

$("content").addEventListener("click", async ev => {
  if (suppressClick) { suppressClick = false; return; }
  const act = ev.target.closest(".acts button");
  if (act) {
    const row = act.closest(".swipe"), e = findEntry(row); closeOpen(); if (!e) return;
    if (act.dataset.act === "edit") { editEntry(e); return; }
    if (!canWrite) { toast("บัญชีนี้ไม่มีสิทธิ์บันทึก ดูข้อมูลได้อย่างเดียว"); return; }
    try {
      await deleteEntry(e); renderAll();
      toast(`ลบ "${e.n}" แล้ว`, { label: "เลิกทำ", fn: async () => {
        try { await saveEntry(e, null); renderAll(); toast("กู้คืนรายการแล้ว"); } catch (err) { toast(failMsg(err)); }
      } });
    } catch (err) { toast(failMsg(err)); }
    return;
  }
  const item = ev.target.closest(".item"); if (!item) return;
  if (openRow) { closeOpen(); return; }
  const e = findEntry(item.parentElement); if (e) editEntry(e);
});
document.addEventListener("pointerdown", ev => { if (openRow && !openRow.contains(ev.target)) closeOpen(); });

function sortedItems() { return all().slice().sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0); }
async function shareFile(name, text, mime) {
  const file = new File([text], name, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; }
    catch (e) { if (e && e.name === "AbortError") return false; }
  }
  const url = URL.createObjectURL(file), link = document.createElement("a");
  link.href = url; link.download = name; document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
function csvText() {
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  return "\uFEFFวันที่,รายการ,ประเภท,หมวด,จำนวน,หมายเหตุ\n" + sortedItems().map(e => [e.d, q(e.n), e.t, q(e.c), e.a, q(e.note)].join(",")).join("\n");
}
function setupExport() {
  const b = $("export"); if (!b) return;
  b.hidden = false;
  b.onclick = async () => { if (await shareFile(`debt-tracker-${todayStr()}.csv`, csvText(), "text/csv")) toast("ส่งออกไฟล์แล้ว"); };
}
function lastBackup() { try { return +localStorage.getItem(BK) || 0; } catch (e) { return 0; } }
function renderBackup() {
  const t = lastBackup(), days = t ? Math.floor((Date.now() - t) / 864e5) : null;
  $("bkInfo").textContent = t ? `สำรองล่าสุด ${new Date(t).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" })}${days ? ` (${days} วันก่อน)` : " (วันนี้)"}` : "ยังไม่เคยสำรองข้อมูล";
  const due = loaded && all().length && (days === null || days >= 7);
  $("bkBanner").hidden = !due;
  if (due) $("bkBannerText").textContent = days === null ? "ยังไม่เคยสำรองข้อมูล ข้อมูลอยู่ในเครื่องนี้เครื่องเดียว" : `ไม่ได้สำรองข้อมูลมา ${days} วันแล้ว`;
}
async function backupNow() {
  const json = JSON.stringify({ app: "debt-tracker", version: 1, exported: new Date().toISOString(), items: sortedItems() });
  if (await shareFile(`debt-tracker-backup-${todayStr()}.json`, json, "application/json")) {
    try { localStorage.setItem(BK, String(Date.now())); } catch (e) {}
    toast("สำรองข้อมูลแล้ว"); renderBackup();
  }
}
function parseCsv(text) {
  const rows = [], re = /("([^"]|"")*"|[^,\n\r]*)(,|\r?\n|$)/g;
  let row = [], m;
  text = text.replace(/^\uFEFF/, "");
  while ((m = re.exec(text)) && m[0] !== "") {
    let v = m[1]; if (v.startsWith('"')) v = v.slice(1, -1).replace(/""/g, '"');
    row.push(v);
    if (m[3] !== ",") { rows.push(row); row = []; }
  }
  return rows.slice(1).filter(r => r.length >= 5 && /^\d{4}-\d{2}-\d{2}$/.test(r[0])).map((r, i) => {
    const e = { id: "r" + Date.now().toString(36) + i, d: r[0], n: r[1], t: r[2], c: r[3], a: +r[4] || 0 };
    if (r[5]) e.note = r[5]; return e;
  });
}
let pendingRestore = null;
$("bkFile").addEventListener("change", async ev => {
  const f = ev.target.files[0]; ev.target.value = ""; if (!f) return;
  let list = null;
  try {
    const text = await f.text();
    if (/\.csv$/i.test(f.name)) list = parseCsv(text);
    else { const j = JSON.parse(text); list = Array.isArray(j) ? j : j.items; }
    list = (list || []).filter(e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.d) && ["ใช้จ่าย", "ยืม", "จ่ายคืน"].includes(e.t));
  } catch (e) { list = null; }
  if (!list || !list.length) { toast("อ่านไฟล์นี้ไม่ได้ ใช้ไฟล์ .json ที่สำรองจากแอพนี้ หรือไฟล์ .csv ที่ส่งออกจากแอพ"); return; }
  pendingRestore = list;
  $("bkConfirm").hidden = false;
  $("bkConfirmText").textContent = `ไฟล์นี้มี ${list.length} รายการ จะแทนที่ข้อมูลในเครื่องตอนนี้ ${all().length} รายการ`;
});
$("bkCancel").onclick = () => { pendingRestore = null; $("bkConfirm").hidden = true; };
$("bkApply").onclick = () => {
  if (!pendingRestore) return;
  const prev = all();
  setItems(pendingRestore);
  try { persist(); } catch (e) { setItems(prev); toast("กู้คืนไม่สำเร็จ พื้นที่ในเครื่องไม่พอ"); return; }
  pendingRestore = null; $("bkConfirm").hidden = true;
  toast("กู้คืนข้อมูลแล้ว"); renderAll();
};
$("bkSave").onclick = backupNow;
$("bkBannerBtn").onclick = backupNow;
$("bkPick").onclick = () => $("bkFile").click();

function renderAll() { renderHero(); renderRecent(); renderView(); renderBackup(); validate(); }

/* ---------- Boot ---------- */
$("date").value = todayStr();
renderForm(); renderView();
(async () => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { saved = null; }
  setItems((saved && saved.items) || []);
  loaded = true;
  const ks = Object.keys(months).sort(), now = todayStr().slice(0, 7);
  if (!months[now] && ks.length) curMonth = ks[ks.length - 1];
  $("status").textContent = ks.length ? "" : "ยังไม่มีข้อมูล จดรายการแรกจากฟอร์มด้านบน หรือกด “กู้คืนจากไฟล์” เพื่อนำข้อมูลเดิมเข้ามา";
  renderAll();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
